{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:85vh;padding:2rem 0;">
    <div class="w-100" style="max-width:520px;">
        <div class="text-center mb-4">
            <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
                <i class="bi bi-person-plus-fill text-white fs-3"></i>
            </div>
            <h2 class="fw-bold" style="font-family:'Poppins',sans-serif;">Create your account</h2>
            <p style="color:#64748b;">Join TalentHub today</p>
        </div>

        <div class="card p-4">
            <!-- Role tabs -->
            <div class="d-flex gap-2 mb-4">
                <button onclick="setRole('student')" id="tab-student"
                        class="btn flex-fill py-2 fw-semibold role-tab active-tab">
                    <i class="bi bi-mortarboard me-1"></i>Student
                </button>
                <button onclick="setRole('company')" id="tab-company"
                        class="btn flex-fill py-2 fw-semibold role-tab">
                    <i class="bi bi-building me-1"></i>Company
                </button>
            </div>

            <form method="POST" id="regForm">
                <input type="hidden" name="role" id="roleField" value="student">

                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
                </div>

                <!-- Student fields -->
                <div id="student-fields">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Your full name">
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label">Branch</label>
                            <select name="branch" class="form-select">
                                <option value="CSE">CSE</option>
                                <option value="ECE">ECE</option>
                                <option value="MECH">MECH</option>
                                <option value="CIVIL">CIVIL</option>
                                <option value="EEE">EEE</option>
                                <option value="IT">IT</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">CGPA</label>
                            <input type="number" name="cgpa" class="form-control" placeholder="e.g. 8.5" min="0" max="10" step="0.01">
                        </div>
                    </div>
                    <div class="mb-3 mt-3">
                        <label class="form-label">Active Backlogs</label>
                        <input type="number" name="backlogs" class="form-control" placeholder="0" min="0" value="0">
                    </div>
                </div>

                <!-- Company fields -->
                <div id="company-fields" style="display:none;">
                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" name="company_name" class="form-control" placeholder="Your company name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Industry</label>
                        <select name="industry" class="form-select">
                            <option value="">Select industry</option>
                            <option value="Technology">Technology</option>
                            <option value="Finance">Finance</option>
                            <option value="E-Commerce">E-Commerce</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Manufacturing">Manufacturing</option>
                            <option value="Consulting">Consulting</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                    <i class="bi bi-person-plus me-2"></i>Create Account
                </button>
            </form>

            <div class="text-center mt-4" style="border-top:1px solid var(--border);padding-top:1.25rem;">
                <p class="mb-0" style="color:#64748b;">
                    Already have an account?
                    <a href="{{ url_for('login') }}" style="color:#a5b4fc;text-decoration:none;font-weight:600;">Sign in →</a>
                </p>
            </div>
        </div>
    </div>
</div>

<style>
.role-tab {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: #94a3b8;
    transition: all 0.2s;
}
.active-tab {
    background: linear-gradient(135deg,rgba(99,102,241,0.2),rgba(99,102,241,0.1)) !important;
    border-color: rgba(99,102,241,0.4) !important;
    color: #a5b4fc !important;
}
</style>
<script>
function setRole(role) {
    document.getElementById('roleField').value = role;
    document.getElementById('student-fields').style.display = role === 'student' ? '' : 'none';
    document.getElementById('company-fields').style.display = role === 'company' ? '' : 'none';
    document.getElementById('tab-student').classList.toggle('active-tab', role === 'student');
    document.getElementById('tab-company').classList.toggle('active-tab', role === 'company');
}
</script>
{% endblock %}
